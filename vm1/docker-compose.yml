
services:

  # PostgreSQL
  postgres:
    image: postgres:18
    container_name: loghive-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - loghive-network


  # ASP.NET Core Backend
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile

    container_name: loghive-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"

      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}

      Ingestion__ApiKey: ${INGESTION_API_KEY}

      Mattermost__WebhookUrl: ${MATTERMOST_WEBHOOK_URL}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - loghive-network


  # React Frontend + Nginx
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile

    container_name: loghive-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - loghive-network


  # Метрики ВМ1 для Prometheus (порт 9100, доступ только с ВМ3)
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    command: --path.rootfs=/host


volumes:
  postgres_data:


networks:
  loghive-network:
    driver: bridge
