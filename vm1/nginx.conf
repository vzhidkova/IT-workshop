server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Запросы к API уходят на контейнер backend (сервис "backend" из docker-compose).
    # Для браузера это тот же домен, поэтому CORS не нужен.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статика с кэшем (файлы Vite имеют хеш в имени)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: любые другие пути отдают index.html
    location / {
        try_files $uri /index.html;
    }
}
